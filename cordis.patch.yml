# dsh-multi2api 的 bundle patch。
#
# 除了挂载本插件，还顺带修掉两处会触发 WorkBuddy/CodeBuddy 上游内容风控的文本：
#
#   HTTP 400 { "code": 11128,
#              "msg": "Illegal API invocation from an unapproved channel",
#              "displayMsg": { "zh": "请求被拦截" } }
#
# 1) 原厂身份句 "You are an AI agent powered by DeepSeek Harness."
#    —— 由 dsh-system-prompt 注入，关掉 includeHarnessIdentity 即可。
#    模型仍会收到 coding agent 的 persona，不影响能力。
#
# 2) harness-dev-context 注入的 Web GUI 段落里
#    "whose URL the runtime context names" 这半句。
#    —— 改用本包内的 dev-context（只把 names 换成 provides，其余逐字相同）。
#
# 两处都只是措辞，语义与信息量不变。详见 README「上游风控规避」。
- insert:
    - id: dsh-multi2api
      name: dsh-multi2api
- id: system-prompt
  config:
    includeHarnessIdentity: false
- id: harness-dev-context
  disabled: true
- insert:
    - id: harness-dev-context-patched
      name: dsh-multi2api/dev-context
